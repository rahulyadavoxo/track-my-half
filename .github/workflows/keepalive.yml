name: Supabase keep-alive
on:
  schedule:
    - cron: "30 3 * * *"   # roz 9:00 AM IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_FUNCTIONS_URL }}/ping" \
            -H "content-type: application/json" -d '{}'
